services:
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./.docker/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: hc
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: hc-sandbox-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hc"]
      interval: 10s
      timeout: 5s
      retries: 5

  healthchecks:
    image: healthchecks/healthchecks:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DB: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: hc
      DB_USER: hc
      DB_PASSWORD: hc-sandbox-password
      # Django
      SECRET_KEY: c0dc6a745e5627ff9a3c4c1e3bb4f4abad97ee2a223002b76ca2517dd494f6e0
      ALLOWED_HOSTS: "*"
      # Admin account (created on first startup)
      SUPERUSER_EMAIL: admin@localhost
      SUPERUSER_PASSWORD: admin
      # App
      SITE_ROOT: http://localhost:8000
      SITE_NAME: Healthchecks
      DEFAULT_FROM_EMAIL: healthchecks@example.com
