# OpenDeepWiki: DeepWiki-style wiki generator + chat + MCP (SQLite, no extra DB).
# Paths are relative to this folder. Upstream publishes images only to an Aliyun
# registry (untagged by release), so both are built from the pinned git tag.
x-odw-ref: &ref https://github.com/AIDotNet/OpenDeepWiki.git#${OPENDEEPWIKI_VERSION:-v2.0.6}

services:
  # Backend: API + MCP (/api/mcp/{owner}/{repo}) + background workers. Host 4370.
  opendeepwiki:
    profiles: ["opendeepwiki"]
    build:
      context: *ref
      dockerfile: src/OpenDeepWiki/Dockerfile
    image: opendeepwiki:${OPENDEEPWIKI_VERSION:-v2.0.6}
    restart: unless-stopped
    user: "0:0"
    ports:
      - "4370:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      URLS: http://+:8080
      Database__Type: sqlite
      ConnectionStrings__Default: Data Source=/data/opendeepwiki.db
      REPOSITORIES_DIRECTORY: /data
      JWT_SECRET_KEY: lab-only-opendeepwiki-jwt-secret-change-me-0123456789abcdef
      # Chat / catalog / content generation, all through LiteLLM `chat`.
      CHAT_API_KEY: ${LAB_KEY:-sk-codebase-lab}
      ENDPOINT: http://litellm:4000/v1
      CHAT_REQUEST_TYPE: OpenAI
      WIKI_CATALOG_MODEL: chat
      WIKI_CATALOG_ENDPOINT: http://litellm:4000/v1
      WIKI_CATALOG_API_KEY: ${LAB_KEY:-sk-codebase-lab}
      WIKI_CATALOG_REQUEST_TYPE: OpenAI
      WIKI_CONTENT_MODEL: chat
      WIKI_CONTENT_ENDPOINT: http://litellm:4000/v1
      WIKI_CONTENT_API_KEY: ${LAB_KEY:-sk-codebase-lab}
      WIKI_CONTENT_REQUEST_TYPE: OpenAI
      # One language and low parallelism: the 3B CPU model is the bottleneck.
      WIKI_LANGUAGES: en
      WIKI_PARALLEL_COUNT: ${OPENDEEPWIKI_PARALLEL:-1}
      WIKI_MAX_CONCURRENT_GENERATIONS: "1"
      # Auto-update: scan every 5 min (upstream minimum), poll every 30 s.
      IncrementalUpdate__Enabled: "true"
      IncrementalUpdate__PollingIntervalSeconds: "30"
      IncrementalUpdate__DefaultUpdateIntervalMinutes: ${OPENDEEPWIKI_UPDATE_MINUTES:-5}
      IncrementalUpdate__MinUpdateIntervalMinutes: "1"
    volumes:
      - ../../.docker/opendeepwiki:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Next.js web UI. Host 4371.
  opendeepwiki-web:
    profiles: ["opendeepwiki"]
    build:
      context: .
      dockerfile: web.Dockerfile
      additional_contexts:
        src: https://github.com/AIDotNet/OpenDeepWiki.git#${OPENDEEPWIKI_VERSION:-v2.0.6}:web
    image: opendeepwiki-web:${OPENDEEPWIKI_VERSION:-v2.0.6}
    restart: unless-stopped
    ports:
      - "4371:3000"
    environment:
      NODE_ENV: production
      SITE_URL: http://localhost:4371
      API_PROXY_URL: http://opendeepwiki:8080
    depends_on:
      - opendeepwiki
