services:
  mysql:
    image: mysql:8.4.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-opik}
      MYSQL_DATABASE: opik
      MYSQL_USER: opik
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opik}
    volumes:
      - .docker/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "opik", "-popik"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zookeeper:
    image: zookeeper:3.9.4
    restart: unless-stopped
    environment:
      ZOO_MY_ID: "1"
      # Allow the `ruok` four-letter word so the healthcheck below can probe it.
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,mntr,conf"
    volumes:
      - .docker/zookeeper:/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56-alpine
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-opik}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - .docker/clickhouse:/var/lib/clickhouse
      # Cluster / macros / zookeeper config so ReplicatedMergeTree and ON CLUSTER
      # DDL (used by the backend's ClickHouse migrations) resolve correctly.
      - ./clickhouse-macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
    healthcheck:
      # ClickHouse binds IPv4 only in this image; probe 127.0.0.1, not localhost/::1.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2.4-alpine3.19
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-opik}"]
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-opik}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-opik-access-key}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-opik-secret-key}
    volumes:
      - .docker/minio:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mc:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 $${MINIO_ROOT_USER:-opik-access-key} $${MINIO_ROOT_PASSWORD:-opik-secret-key} &&
      mc mb --ignore-existing minio/opik
      "

  backend:
    image: ghcr.io/comet-ml/opik/opik-backend:latest
    restart: unless-stopped
    # Run the MySQL (Liquibase) + ClickHouse DB migrations before starting the app.
    command: ["bash", "-c", "./run_db_migrations.sh && ./entrypoint.sh"]
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=80.0"
      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: opik
      STATE_DB_PASS: ${MYSQL_PASSWORD:-opik}
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://clickhouse:8123"
      ANALYTICS_DB_MIGRATIONS_USER: opik
      ANALYTICS_DB_MIGRATIONS_PASS: ${CLICKHOUSE_PASSWORD:-opik}
      ANALYTICS_DB_PROTOCOL: HTTP
      ANALYTICS_DB_HOST: clickhouse
      ANALYTICS_DB_PORT: "8123"
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: ${CLICKHOUSE_PASSWORD:-opik}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-opik}@redis:6379/"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-opik-access-key}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-opik-secret-key}
      IS_MINIO: "true"
      S3_URL: "http://minio:9000"
      PYTHON_EVALUATOR_URL: "http://python-backend:8000"
      CORS: "false"
      OPIK_USAGE_REPORT_ENABLED: "false"
      TOGGLE_OPIK_AI_ENABLED: "false"
      TOGGLE_GUARDRAILS_ENABLED: "false"
      TOGGLE_WELCOME_WIZARD_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/is-alive/ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 120s

  python-backend:
    image: ghcr.io/comet-ml/opik/opik-python-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      OPIK_BACKEND_URL: "http://backend:8080"
      DATABASE_DIALECT: "mysql+pymysql"
      DATABASE_HOST: "mysql"
      DATABASE_PORT: "3306"
      DATABASE_NAME: "opik"
      DATABASE_USER: "opik"
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-opik}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # Image ships wget (no curl); health route is /healthcheck and binds IPv4.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:latest
    restart: unless-stopped
    environment:
      NGINX_PORT: "5173"
    volumes:
      # Opik frontend nginx template: serves on ${NGINX_PORT} and proxies /api to the backend.
      - ./nginx_default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
