x-api-env: &api-env
  AGENTA_LICENSE: oss
  AGENTA_AUTH_KEY: ${AGENTA_AUTH_KEY:-changeme-auth-key-32-chars-minimum}
  AGENTA_CRYPT_KEY: ${AGENTA_CRYPT_KEY:-changeme-crypt-key-32-chars-min}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenta}:${POSTGRES_PASSWORD:-agenta}@postgres:5432/agenta
  REDIS_URL: redis://redis-volatile:6379/0
  CELERY_BROKER_URL: redis://redis-volatile:6379/1
  CELERY_RESULT_BACKEND: redis://redis-durable:6379/0
  SUPERTOKENS_CONNECTION_URI: http://supertokens:3567
  AGENTA_API_URL: http://traefik:80/api
  AGENTA_SERVICES_URL: http://traefik:80/services
  AGENTA_WEB_URL: http://localhost:${AGENTA_PORT:-8081}

services:
  traefik:
    image: traefik:2
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${AGENTA_PORT:-8081}:80"
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    image: ghcr.io/agenta-ai/agenta-web:${AGENTA_WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: sh -c "node ./oss/server.js"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    environment:
      NEXT_PUBLIC_AGENTA_API_URL: http://localhost:${AGENTA_PORT:-8081}
    depends_on:
      - api

  api:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    environment:
      <<: *api-env
      SCRIPT_NAME: /api
    depends_on:
      postgres:
        condition: service_healthy
      redis-volatile:
        condition: service_healthy
      redis-durable:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully

  alembic:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: "no"
    command: python -m oss.databases.postgres.migrations.runner
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  worker-evaluations:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m oss.entrypoints.worker_evaluations
    environment:
      <<: *api-env
    depends_on:
      alembic:
        condition: service_completed_successfully

  worker-tracing:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m oss.entrypoints.worker_tracing
    environment:
      <<: *api-env
    depends_on:
      alembic:
        condition: service_completed_successfully

  worker-webhooks:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m oss.entrypoints.worker_webhooks
    environment:
      <<: *api-env
    depends_on:
      alembic:
        condition: service_completed_successfully

  worker-events:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m oss.entrypoints.worker_events
    environment:
      <<: *api-env
    depends_on:
      alembic:
        condition: service_completed_successfully

  cron:
    image: ghcr.io/agenta-ai/agenta-api:${AGENTA_API_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: supercronic /app/crontab
    environment:
      <<: *api-env
    depends_on:
      - api

  services:
    image: ghcr.io/agenta-ai/agenta-services:${AGENTA_SERVICES_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.services.rule=PathPrefix(`/services`)"
      - "traefik.http.routers.services.priority=10"
      - "traefik.http.services.services.loadbalancer.server.port=8080"
    environment:
      SCRIPT_NAME: /services
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenta}:${POSTGRES_PASSWORD:-agenta}@postgres:5432/agenta
    depends_on:
      alembic:
        condition: service_completed_successfully

  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql
    restart: unless-stopped
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-agenta}:${POSTGRES_PASSWORD:-agenta}@postgres:5432/supertokens
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenta}
      POSTGRES_DB: agenta
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
      - ./init/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-volatile:
    image: redis:8
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - .docker/redis-volatile:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-durable:
    image: redis:8
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - .docker/redis-durable:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
