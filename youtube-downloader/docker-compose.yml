services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - TZ=Europe/Prague
    ports:
      - '8945:8945'
    volumes:
      - ./.docker/pinchflat/config:/config
      - ./.docker/pinchflat/downloads:/downloads

  metube:
    image: ghcr.io/alexta69/metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./.docker/metube/downloads:/downloads