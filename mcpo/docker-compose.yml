services:
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["--host", "0.0.0.0", "--port", "8000", "--api-key", "${MCPO_API_KEY:-top-secret}", "--config", "/app/config.json"]
    volumes:
      - ./config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/docs').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
