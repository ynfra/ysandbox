services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Prague
      PASSWORD: coder
      SUDO_PASSWORD: coder
      DEFAULT_WORKSPACE: /config/workspace
    volumes:
      - ./.docker/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
