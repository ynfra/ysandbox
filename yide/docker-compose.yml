services:
  # Variant 1 — official upstream image by Coder
  # http://localhost:3010  password: coder
  codercom:
    image: codercom/code-server:latest
    restart: unless-stopped
    ports:
      - "3010:8080"
    volumes:
      - ./.docker/codercom/config:/home/coder/.config
      - ./.docker/codercom/workspace:/home/coder/project
    environment:
      PASSWORD: coder

  # Variant 2 — LinuxServer.io wrapper around code-server
  # http://localhost:3020  password: coder
  linuxserver:
    image: lscr.io/linuxserver/code-server:latest
    restart: unless-stopped
    ports:
      - "3020:8443"
    volumes:
      - ./.docker/linuxserver/config:/config
    environment:
      PASSWORD: coder
      TZ: Europe/Prague

  # Variant 3 — Gitpod's openvscode-server (LinuxServer wrapper)
  # http://localhost:3030/?tkn=coder
  openvscode:
    image: lscr.io/linuxserver/openvscode-server:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./.docker/openvscode/config:/config
    environment:
      CONNECTION_TOKEN: coder
      TZ: Europe/Prague

  # Variant 4 — Eclipse Theia (no built-in auth)
  # http://localhost:3040
  theia:
    image: theiaide/theia:latest
    restart: unless-stopped
    ports:
      - "3040:3000"
    volumes:
      - ./.docker/theia/workspace:/home/project
    user: root
