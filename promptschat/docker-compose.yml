services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompts
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-prompts}"
      POSTGRES_DB: prompts
    volumes:
      - ./.docker/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompts -d prompts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ghcr.io/f/prompts.chat:latest
    restart: unless-stopped
    ports:
      - "${PORT:-4444}:4444"
    environment:
      DATABASE_URL: "postgresql://prompts:${POSTGRES_PASSWORD:-prompts}@db:5432/prompts?schema=public"
      DIRECT_URL: "postgresql://prompts:${POSTGRES_PASSWORD:-prompts}@db:5432/prompts?schema=public"
      # Sandbox secret — override for anything non-local (see README)
      AUTH_SECRET: "${AUTH_SECRET:-sandbox-auth-secret-change-me}"
      # Auth.js URL handling. Without these, Auth.js derives its base URL from
      # the container bind address (0.0.0.0:3000) and sends login/logout
      # redirects to the wrong port, and rejects the forwarded host with
      # `UntrustedHost`. We pin the public URL AND run the app on the same
      # port we publish (4444) so external, internal and auth URLs all agree —
      # this also keeps any server-side call to AUTH_URL resolvable in-container.
      AUTH_URL: "${AUTH_URL:-http://localhost:4444}"
      AUTH_TRUST_HOST: "true"
      PORT: "4444"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Setting any PCHAT_NAME flips useCloneBranding=true, which hides the
      # upstream marketing: announcement banner, app-store banner, hero
      # headlines, achievements, and the sponsors/"CLIENTS" block.
      PCHAT_NAME: "prompts.chat"
      # Local accounts only — email/password login with open registration.
      PCHAT_AUTH_PROVIDERS: "credentials"
      PCHAT_ALLOW_REGISTRATION: "true"
      # Telemetry stays OFF: GOOGLE_ANALYTICS_ID, GOOGLE_ADSENSE_ACCOUNT and
      # Sentry (NEXT_PUBLIC_SENTRY_DSN / SENTRY_AUTH_TOKEN) are intentionally
      # unset — the app only wires those up when their env vars are present.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4444/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
