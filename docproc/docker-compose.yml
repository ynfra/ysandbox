services:
  docling:
    image: ghcr.io/ds4sd/docling-serve:latest
    restart: unless-stopped
    ports:
      - "5001:5001"

  paddleocr:
    build: ./paddleocr
    restart: unless-stopped
    ports:
      - "8866:8866"

  browserless:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      CONCURRENT: 3
      TIMEOUT: 30000

  thumbor:
    image: ghcr.io/minimalcompact/thumbor:latest
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./.docker/thumbor:/data
    environment:
      THUMBOR_SECURITY_KEY: thumbor-sandbox-key
      ALLOW_UNSAFE_URL: "True"
