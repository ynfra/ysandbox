# Traceloop Hub — provider config for YAML mode
# Use when HUB_MODE=yaml in .env (stateless, no database needed)
# Add to docker-compose.yml hub service:
#   volumes:
#     - ./config.yaml:/app/config.yaml

providers:
  openai:
    base_url: https://api.openai.com/v1
  anthropic:
    base_url: https://api.anthropic.com
  ollama:
    base_url: http://host.docker.internal:11434/v1

pipelines:
  - name: default
    provider: openai
    model: gpt-4o
