user www-data;
worker_processes auto;
worker_rlimit_nofile 8192;

pid /var/run/nginx.pid;

events {
    worker_connections 8000;
}

http {

    # Basic
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 2048;
    server_tokens off;

    # Cache
    proxy_cache_path /srv/cache1 levels=1:2 keys_zone=cache1:10m max_size=10g inactive=5m use_temp_path=off;
    proxy_cache_path /srv/cache2 levels=1:2 keys_zone=cache2:10m max_size=10g inactive=5m use_temp_path=off;

    # Server
    server {
        listen 80;

        location / {
            proxy_pass http://app:3000;
        }

        location /10s {
            # Cache
            proxy_cache cache1;
            proxy_cache_valid any 10s;
            proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            add_header Cache-Control "public, max-age=600, s-maxage=600, stale-while-revalidate=300, stale-if-error=300" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cdn-Handler "200";
            add_header X-Cdn-Server $hostname always;

            proxy_pass http://app:3000;
        }

        location /60s {
            # Cache
            proxy_cache cache2;
            proxy_cache_valid any 60s;
            proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            add_header Cache-Control "public, max-age=600, s-maxage=600, stale-while-revalidate=300, stale-if-error=300" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cdn-Handler "200";
            add_header X-Cdn-Server $hostname always;

            proxy_pass http://app:3000;
        }
    }
}
