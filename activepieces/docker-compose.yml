services:
  activepieces:
    image: ghcr.io/activepieces/activepieces:0.86.0
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Sandbox-only secrets — regenerate for real use:
      #   AP_ENCRYPTION_KEY: openssl rand -hex 16   (32 hex chars)
      #   AP_JWT_SECRET:     openssl rand -hex 32
      AP_ENCRYPTION_KEY: 017ff4b1fa7ebb56aa6f4933b4708973
      AP_JWT_SECRET: 555f11432409e23fb590c90a806633c65c73ee0002c32ded4c3c04ea384c697a
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: http://localhost:8081
      # UNSANDBOXED is required when the container is not privileged (no isolated sandbox).
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_USERNAME: activepieces
      AP_POSTGRES_PASSWORD: activepieces
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: "6379"
      AP_TELEMETRY_ENABLED: "false"
    volumes:
      - .docker/cache:/usr/src/app/cache

  postgres:
    # Upstream's reference compose uses a pgvector-enabled Postgres image
    # (needed for AI/table features) — pinned to the pg16 build.
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: activepieces
      POSTGRES_PASSWORD: activepieces
      POSTGRES_DB: activepieces
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces -d activepieces"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - .docker/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
