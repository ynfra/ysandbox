services:
  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpjungle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpjungle}
      POSTGRES_DB: ${POSTGRES_DB:-mcpjungle}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpjungle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcpjungle:
    image: ghcr.io/mcpjungle/mcpjungle:${MCPJUNGLE_IMAGE_TAG:-latest-stdio}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mcpjungle}:${POSTGRES_PASSWORD:-mcpjungle}@postgres:5432/${POSTGRES_DB:-mcpjungle}?sslmode=disable
      SERVER_MODE: ${SERVER_MODE:-development}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: ${MCP_SERVER_INIT_REQ_TIMEOUT_SEC:-10}
    volumes:
      # Mount host current directory as /host so filesystem-based MCP servers
      # can be registered with a path under /host (read-only by default).
      - .:/host:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
