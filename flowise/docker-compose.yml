services:
  flowise:
    image: flowiseai/flowise:3.1.3
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      # Basic-auth for the app UI (sandbox defaults)
      FLOWISE_USERNAME: ${FLOWISE_USERNAME:-admin}
      FLOWISE_PASSWORD: ${FLOWISE_PASSWORD:-admin}
      # SQLite storage under /root/.flowise
      DATABASE_TYPE: ${DATABASE_TYPE:-sqlite}
      DATABASE_PATH: ${DATABASE_PATH:-/root/.flowise}
      APIKEY_PATH: ${APIKEY_PATH:-/root/.flowise}
      SECRETKEY_PATH: ${SECRETKEY_PATH:-/root/.flowise}
      LOG_PATH: ${LOG_PATH:-/root/.flowise/logs}
      BLOB_STORAGE_PATH: ${BLOB_STORAGE_PATH:-/root/.flowise/storage}
      DISABLE_FLOWISE_TELEMETRY: ${DISABLE_FLOWISE_TELEMETRY:-true}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - .docker/flowise:/root/.flowise
    entrypoint: /bin/sh -c "sleep 3; flowise start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/api/v1/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
