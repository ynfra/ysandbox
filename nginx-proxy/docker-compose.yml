services:
  nginx:
    image: nginx:1.27
    volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80

  app1:
    image: oven/bun:latest
    command: ["bun", "/app/server.js"]
    volumes:
      - ./app/server.js:/app/server.js
    environment:
      - SERVICE_NAME=app1
    ports:
      - 3001:3000

  app2:
    image: oven/bun:latest
    command: ["bun", "/app/server.js"]
    volumes:
      - ./app/server.js:/app/server.js
    environment:
      - SERVICE_NAME=app2
    ports:
      - 3002:3000
